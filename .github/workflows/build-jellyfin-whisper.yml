name: Build and Push Jellyfin Whisper Image

# Make the published image PUBLIC (one-time, then sticky for all future pushes):
#   1. Push so the package is first created under your account.
#   2. GitHub → Profile → Packages → jellyfin-whisper-vulkan → Package settings.
#   3. "Danger Zone" → Change visibility → Public.
# GHCR has no API to set visibility, so this manual step is required exactly once;
# every subsequent CI push keeps the package public.

on:
  push:
    branches:
      - main
    paths:
      - jellyfin.Dockerfile
      - .github/workflows/build-jellyfin-whisper.yml
  schedule:
    # Rebuild weekly to pick up Jellyfin base-image and security updates.
    - cron: '0 6 * * 1'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/jellyfin-whisper-vulkan

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./jellyfin.Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
